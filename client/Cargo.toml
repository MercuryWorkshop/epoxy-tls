[package]
name = "epoxy-client"
version = "3.0.0"
edition = "2024"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hyper = { git = "https://github.com/r58Playz/hyper", features = ["client", "http1"] } # fork rebased onto v1.10.1 so the patch outranks crates.io; re-rebase when hyper releases
hyper-util = { git = "https://github.com/r58Playz/hyper-util", branch = "tokio-client", features = ["client-pool"] }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
async-compression = { version = "0.4.20", default-features = false, features = ["tokio", "gzip", "zlib", "brotli"] }
tower = { version = "0.5.3", features = ["util"] }
tower-service = "0.3.3"
tower-layer = "0.3.3"
thiserror = "2.0.12"
wisp-mux = { version = "6.0.0", path = "../wisp" }
bytes = "1.10.1"
pin-project = "1.1.10"
tokio-util = { version = "0.7.16", features = ["io"] }
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.91"
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
wasm-streams = "0.6.0"
webpki-roots = "1.0.10"
futures-rustls = { version = "0.26.0", default-features = false, features = ["tls12", "ring"] }
http-body-util = "0.1.3"
http = "1.3.1"
http-body = "1.0.1"
async-trait = "0.1.89"
tower-http = { version = "0.6.8", features = ["decompression-br", "decompression-deflate", "decompression-gzip", "follow-redirect", "set-header", "util"] }
fastwebsockets = { optional = true, version = "0.10.0", features = ["unstable-split"] }
tokio = { version = "1.50.0", features = ["io-util"] }
base64 = "0.22.1"

[features]
default = ["extended"]
minimal = []
full = ["minimal", "hyper/http2", "dep:fastwebsockets"]
extended = ["full"]
debug = []

[dependencies.ring]
version = "*"
features = ["wasm32_unknown_unknown_js"]

[dependencies.rustls-pki-types]
version = "*"
features = ["web"]

[dependencies.instant]
version = "*"
features = ["wasm-bindgen"]

[dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

# Standalone workspace (excluded from the repo-root workspace) so the fork
# patches below apply only to the wasm client, with their own Cargo.lock.
[workspace]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
missing_fields_in_debug = "allow"
case_sensitive_file_extension_comparisons = "allow"

[patch.crates-io]
h2 = { git = "https://github.com/r58Playz/h2-wasm" }
hyper = { git = "https://github.com/r58Playz/hyper" }

[profile.release]
lto = true
debug = true
strip = false
panic = "abort"
codegen-units = 1
opt-level = 'z'
