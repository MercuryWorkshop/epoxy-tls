[package]
name = "epoxy-client"
version = "3.0.0"
edition = "2024"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hyper = { git = "https://github.com/r58Playz/hyper", features = ["client", "http1"] } # fork rebased onto v1.10.1 so the patch outranks crates.io; re-rebase when hyper releases
hyper-util = { git = "https://github.com/r58Playz/hyper-util", branch = "tokio-client", features = ["client-pool"] }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# zstd because Chrome advertises it. `accept-encoding` is not a free string:
# measured against Chromium 155, a browser sends `gzip, deflate, br, zstd` and
# this client sent `gzip,deflate,br` -- no zstd and no spaces, which is the
# signature of an HTTP library rather than a browser. Advertising zstd without
# being able to decode it would be worse than not advertising it, so the
# decoder comes with the claim.
async-compression = { version = "0.4.20", default-features = false, features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
tower = { version = "0.5.3", features = ["util"] }
tower-service = "0.3.3"
tower-layer = "0.3.3"
thiserror = "2.0.12"
wisp-mux = { version = "6.0.0", path = "../wisp" }
bytes = "1.10.1"
pin-project = "1.1.10"
tokio-util = { version = "0.7.16", features = ["io"] }
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.91"
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
wasm-streams = "0.6.0"
webpki-roots = "1.0.6"
futures-rustls = { version = "0.26.0", default-features = false, features = ["tls12", "ring"] }
# Direct, only to turn on brotli certificate decompression. Chrome offers
# `compress_certificate` with brotli and Cloudflare takes the offer, so a client
# that advertises it without a decompressor gets a `CompressedCertificate`
# handshake message where it expects `Certificate` and the connection dies.
# Offering it is not optional either -- it is one of the eighteen extensions in
# Chrome's hello. So: offer it and mean it.
rustls = { version = "0.23", default-features = false, features = ["brotli"] }
http-body-util = "0.1.3"
http = "1.3.1"
http-body = "1.0.1"
async-trait = "0.1.89"
tower-http = { version = "0.6.8", features = ["decompression-br", "decompression-deflate", "decompression-gzip", "decompression-zstd", "follow-redirect", "set-header", "util"] }
fastwebsockets = { optional = true, version = "0.10.0", features = ["unstable-split"] }
tokio = { version = "1.50.0", features = ["io-util"] }
base64 = "0.22.1"

[features]
default = ["extended"]
minimal = []
full = ["minimal", "hyper/http2", "dep:fastwebsockets"]
extended = ["full"]
debug = []

[dependencies.ring]
version = "*"
features = ["wasm32_unknown_unknown_js"]

[dependencies.rustls-pki-types]
version = "*"
features = ["web"]

[dependencies.instant]
version = "*"
features = ["wasm-bindgen"]

[dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

# Standalone workspace (excluded from the repo-root workspace) so the fork
# patches below apply only to the wasm client, with their own Cargo.lock.
[workspace]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
missing_fields_in_debug = "allow"
case_sensitive_file_extension_comparisons = "allow"

[patch.crates-io]
# Local checkout, patched to emit Chrome's ClientHello. Cloudflare branches on
# the handshake -- proven by running stock Chromium with
# `--cipher-suite-blacklist=0x1301,0x1302,0x1303`, which changes nothing but the
# handshake and moves it onto the same challenge branch the proxy gets.
rustls = { path = "../../rustls-chrome/rustls" }
# Local checkout, not the git URL: the pseudo-header order in
# `src/frame/headers.rs` is patched to Chrome's `:method :authority :scheme
# :path`, which is the last field of the Akamai HTTP/2 fingerprint. Point this
# back at the git remote once that is upstream.
h2 = { path = "../../h2-wasm" }
hyper = { git = "https://github.com/r58Playz/hyper" }

[profile.release]
lto = true
debug = true
strip = false
panic = "abort"
codegen-units = 1
opt-level = 'z'
