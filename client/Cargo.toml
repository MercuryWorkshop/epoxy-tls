[package]
name = "epoxy-client"
version = "3.0.0"
edition = "2024"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
hyper = { git = "https://github.com/r58Playz/hyper", features = ["client", "http1"] } # replaced by patch
hyper-util = { git = "https://github.com/r58Playz/hyper-util", branch = "tokio-client", features = ["client-pool"] }
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
async-compression = { version = "0.4.20", default-features = false, features = ["tokio", "gzip", "zlib", "brotli"] }
tower = { version = "0.4.13", features = ["util"] }
tower-service = "0.3.3"
tower-layer = "0.3.3"
thiserror = "2.0.12"
wisp-mux = { version = "6.0.0", path = "../wisp" }
bytes = "1.10.1"
pin-project = "1.1.10"
tokio-util = { version = "0.7.16", features = ["io"] }
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.91"
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
wasm-streams = "0.4.2"
webpki-roots = "1.0.6"
futures-rustls = { version = "0.26.0", default-features = false, features = ["tls12", "ring"] }
http-body-util = "0.1.3"
http = "1.3.1"
http-body = "1.0.1"
async-trait = "0.1.89"
tower-http = { version = "0.6.8", features = ["decompression-br", "decompression-deflate", "decompression-gzip", "follow-redirect", "set-header", "util"] }
fastwebsockets = { optional = true, version = "0.10.0", features = ["unstable-split"] }
tokio = { version = "1.50.0", features = ["io-util"] }
base64 = "0.22.1"

# arti / tor — pinned to a fork that adds the wasm-friendly hooks
# (DynStateMgr, DynStore, DirMgrStoreBuilder, etc.). See
# https://github.com/r58Playz/arti for the changes.
arti-client = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true, features = [
	"experimental-api",
	"error_detail",
	"pt-client-external",
	"bridge-client",
	"onion-service-client",
] }
tor-persist = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true }
tor-rtcompat = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true }
tor-proto = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true }
tor-error = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true }
tor-general-addr = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true }
tor-config-path = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true, features = ["arti-client"] }
tor-dirmgr = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true, features = ["bridge-client"] }
tor-guardmgr = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true, features = ["bridge-client"] }
tor-netdoc = { git = "https://github.com/r58Playz/arti", rev = "e271774e870ca158211f1c1b19b448b2eb49b879", default-features = false, optional = true }
web-time = { version = "1.1.0", optional = true }
serde_json = { version = "1.0", optional = true }
coarsetime = { version = "0.1.36", optional = true }
rustls-webpki = { version = "0.103", optional = true }
void = { version = "1", optional = true }

[features]
default = ["extended"]
minimal = []
full = ["minimal", "hyper/http2", "dep:fastwebsockets"]
extended = ["full", "tor"]
tor = [
	"dep:arti-client",
	"dep:tor-persist",
	"dep:tor-rtcompat",
	"dep:tor-proto",
	"dep:tor-error",
	"dep:tor-general-addr",
	"dep:tor-config-path",
	"dep:tor-dirmgr",
	"dep:tor-guardmgr",
	"dep:tor-netdoc",
	"dep:web-time",
	"dep:serde_json",
	"dep:coarsetime",
	"dep:rustls-webpki",
	"dep:void",
]
debug = []

[dependencies.ring]
version = "*"
features = ["wasm32_unknown_unknown_js"]

[dependencies.rustls-pki-types]
version = "*"
features = ["web"]

[dependencies.instant]
version = "*"
features = ["wasm-bindgen"]
